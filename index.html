<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="智能多功能响应式导航">
<meta name="keywords" content="网址导航,开发者导航,智能导航,Cloudflare">
<title id="page-title">智能多功能响应式导航</title>
<link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body.theme-light{background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);color:#0f172a}
body.theme-dark{background:linear-gradient(135deg,#0f172a 0%,#020617 100%);color:#f8fafc}
.glass-card{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:.3s}
body.theme-light .glass-card{background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.06);box-shadow:0 10px 25px -5px rgba(0,0,0,.05)}
body.theme-dark .glass-card{background:rgba(30,41,59,.45);border:1px solid rgba(255,255,255,.05);box-shadow:0 20px 25px -5px rgba(0,0,0,.3)}
body.theme-light .glass-input{background:rgba(0,0,0,.04);color:#000}
body.theme-dark .glass-input{background:rgba(255,255,255,.07)}
body.has-custom-bg::before{content:"";position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);z-index:-1}
body:not(.is-admin) .admin-only{display:none!important}
.dragging{opacity:.4;transform:scale(.98);border:2px dashed #6366f1!important}
</style>
</head>
<body class="theme-dark font-sans antialiased selection:bg-indigo-500 selection:text-white">

<div class="fixed top-5 right-5 z-[150]">
<button aria-label="个性化设置" onclick="toggleThemeMenu(event)" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-400 hover:text-indigo-400 shadow-lg">
<i class="fas fa-palette"></i>
</button>
<div id="theme-panel" class="absolute right-0 top-full mt-2 w-64 bg-slate-900/95 border border-slate-700 rounded-2xl shadow-2xl hidden backdrop-blur-md p-4 space-y-3 z-[160]" onclick="event.stopPropagation()">
<div class="text-[11px] font-bold text-slate-400">语言 / Language</div>
<div class="flex gap-2">
<button onclick="setLanguage('zh')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs">中文</button>
<button onclick="setLanguage('en')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs">English</button>
</div>
<div class="text-[11px] font-bold text-slate-400 border-t border-slate-800 pt-3">基础色彩模式</div>
<div class="flex gap-2">
<button onclick="setBaseTheme('theme-light')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs">☀️ 日间</button>
<button onclick="setBaseTheme('theme-dark')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs">🌙 夜间</button>
</div>
<div class="admin-only space-y-2 border-t border-slate-800 pt-3">
<label class="text-[11px] text-slate-400 font-bold">自定义背景（全站同步）</label>
<div class="flex gap-1.5">
<input id="custom-bg-input" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100">
<button onclick="applyCustomBg()" class="bg-indigo-600 text-white px-2 rounded-lg text-xs">应用</button>
</div>
<button onclick="clearCustomBg()" id="clear-bg-btn" class="text-[10px] text-red-400 hidden">清除壁纸</button>
</div>
<div class="admin-only space-y-2 border-t border-slate-800 pt-3">
<label class="text-[11px] text-slate-400 font-bold">修改管理员密码</label>
<div class="flex gap-1.5">
<input type="password" id="custom-pwd-input" placeholder="输入新密码" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100">
<button onclick="updateAdminPwd()" class="bg-emerald-600 text-white px-2 rounded-lg text-xs">保存</button>
</div>
</div>
<div class="admin-only border-t border-slate-800 pt-2">
<button onclick="logoutAdmin()" class="w-full py-1.5 rounded-lg bg-red-950/40 border border-red-900/40 text-red-400 text-xs">退出后台管理</button>
</div>
</div>
</div>

<main class="max-w-7xl mx-auto px-4 py-12 lg:py-20 flex flex-col items-center">
<div class="text-center mb-10">
<h1 id="clock" class="text-5xl lg:text-7xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 mb-2">00:00:00</h1>
<div class="flex items-center justify-center gap-3 text-sm md:text-base">
<span id="greeting" class="text-indigo-400"></span><span class="opacity-30">|</span>
<span id="weather-info" class="text-emerald-400"><i class="fas fa-spinner fa-spin"></i></span>
</div>
</div>

<div class="w-full max-w-2xl mb-16 relative z-[100]">
<form id="search-form" action="https://www.google.com/search" method="get" target="_blank" class="relative">
<div class="flex items-center glass-input rounded-2xl border border-slate-700/40 shadow-2xl focus-within:border-indigo-500/80">
<div class="relative pl-4">
<button type="button" onclick="toggleEngineMenu(event)" class="flex items-center gap-2 text-slate-400 py-4 pr-2">
<i id="engine-icon" class="fab fa-google text-blue-400"></i><i class="fas fa-chevron-down text-xs opacity-50"></i>
</button>
<div id="engine-menu" class="absolute left-2 top-full mt-2 w-40 bg-slate-950/95 border border-slate-800 rounded-xl shadow-2xl hidden overflow-hidden z-[110]">
<button type="button" onclick="selectEngine('google')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm">🔵 Google</button>
<button type="button" onclick="selectEngine('bing')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm">🟢 Bing</button>
<button type="button" onclick="selectEngine('baidu')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm">🔴 Baidu</button>
<button type="button" onclick="selectEngine('github')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm">⚫ GitHub</button>
</div>
</div>
<input id="search-input" name="q" placeholder="在 Google 中搜索..." autocomplete="off" class="w-full bg-transparent border-none py-4 px-3 focus:outline-none text-base">
<button type="submit" class="mr-3 p-2.5 text-slate-400 hover:text-indigo-400"><i class="fas fa-search text-lg"></i></button>
</div>
</form>
</div>

<div id="main-nav-grid" class="w-full grid grid-cols-1 xl:grid-cols-3 gap-8 mb-8 items-start">
<section id="card-custom" class="glass-card rounded-2xl p-6 shadow-xl">
<div class="flex justify-between items-center mb-4">
<h3 class="text-lg font-semibold text-pink-400"><i class="fas fa-folder-plus mr-2.5"></i><span>站长推荐</span></h3>
<button onclick="openLinkModal('custom')" class="admin-only text-xs px-2.5 py-1 bg-pink-600/20 text-pink-400 rounded-lg">添加</button>
</div>
<div id="custom-links-container"></div>
<div id="expand-action-wrapper" class="mt-4 pt-2 border-t border-slate-500/10 text-center hidden">
<button onclick="toggleExpandCustomLinks()" id="expand-btn" class="text-xs text-pink-400"></button>
</div>
</section>
<div id="add-section-card" class="admin-only glass-card rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer border-dashed border-2 border-slate-500/30" onclick="addCustomSection()" style="min-height:180px">
<i class="fas fa-plus text-3xl text-slate-400 mb-2"></i><span class="text-sm text-slate-400">添加自定义区域</span>
</div>
</div>

<section class="w-full relative z-10 mb-12">
<div class="glass-card rounded-2xl p-6 shadow-xl">
<div class="flex justify-between items-center mb-4">
<h3 class="text-base font-semibold text-emerald-400"><i class="fas fa-handshake mr-2.5"></i>友情链接</h3>
<button onclick="openLinkModal('friend')" class="admin-only text-xs px-2.5 py-1 bg-emerald-600/20 text-emerald-400 rounded-lg">添加</button>
</div>
<div id="friend-links-container" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3"></div>
</div>
</section>

<footer ondblclick="triggerAdminLogin()" class="text-slate-500 text-xs mt-4 cursor-pointer select-none hover:text-indigo-400">
© 2026 智能生态导航 · Powered by Cloudflare
<span id="admin-badge" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 font-bold hidden">已登入</span>
</footer>
</main>

<div id="modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden items-center justify-center p-4 z-[300]" onclick="closeModalOnBlank(event)">
<div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm shadow-2xl text-slate-100" onclick="event.stopPropagation()">
<h4 class="font-semibold text-slate-200 mb-4"><i class="fas fa-link mr-2 text-indigo-400"></i><span id="modal-title-text">添加网址</span></h4>
<div class="space-y-4 mb-5">
<div><label class="text-xs text-slate-400 block mb-1.5">网站名称</label><input id="site-name" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm"></div>
<div><label class="text-xs text-slate-400 block mb-1.5">网站网址</label><input id="site-url" placeholder="www.example.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm"></div>
<label id="private-link-wrap" class="flex items-center gap-2 text-xs text-slate-300">
<input type="checkbox" id="private-link"> 登录后可见（私密）
</label>
</div>
<div class="flex justify-end gap-3">
<button onclick="toggleModal(false)" class="px-4 py-2 bg-slate-800 text-slate-400 text-xs rounded-xl">取消</button>
<button onclick="saveActiveLink()" class="px-4 py-2 bg-indigo-600 text-white text-xs rounded-xl">保存</button>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let currentLang=localStorage.getItem('nav_lang')||'zh';
let isAdmin=false,isCustomLinksExpanded=false,currentModalTarget='custom',expandedDynamicSections={};
let cloudConfig={wallpaper:"",dynamicSections:[],adminPwd:""};
const engines={
 google:{action:'https://www.google.com/search',name:'q',placeholder:'在 Google 中搜索...',icon:'fab fa-google text-blue-400'},
 bing:{action:'https://cn.bing.com/search',name:'q',placeholder:'在 必应 Bing 中搜索...',icon:'fab fa-microsoft text-teal-400'},
 baidu:{action:'https://www.baidu.com/s',name:'wd',placeholder:'在 百度中搜索...',icon:'fas fa-paw text-red-400'},
 github:{action:'https://github.com/search',name:'q',placeholder:'在 GitHub 中搜索仓库...',icon:'fab fa-github text-slate-400'}
};
const t=k=>({
 zh:{loading:'正在加载...',noLinks:'暂无链接',expand:'展开显示更多',collapse:'收起',addSection:'添加自定义区域',private:'登录后可见',public:'公开',login:'请输入管理员密码：',success:'认证成功！',fail:'密码错误！',logout:'已退出后台管理。',pwd:'输入新密码',pwdok:'管理员密码修改成功。',promptSection:'请输入区域名称：',rename:'请输入新的区域名称：',deleteSection:'确定删除整个区域及其所有链接吗？',deleteLink:'确定删除这个链接吗？'},
 en:{loading:'Loading...',noLinks:'No links',expand:'Show more',collapse:'Collapse',addSection:'Add custom section',private:'Private',public:'Public',login:'Enter admin password:',success:'Authenticated!',fail:'Incorrect password!',logout:'Logged out.',pwd:'New password',pwdok:'Admin password updated.',promptSection:'Section name:',rename:'New section name:',deleteSection:'Delete this entire section and its links?',deleteLink:'Delete this link?'}
}[currentLang][k]||k);

function setLanguage(lang){currentLang=lang;localStorage.setItem('nav_lang',lang);renderAll();$('theme-panel').classList.add('hidden')}
function setBaseTheme(theme){document.body.classList.remove('theme-light','theme-dark');document.body.classList.add(theme);localStorage.setItem('nav_theme_mode',theme);$('theme-panel').classList.add('hidden')}
function toggleThemeMenu(e){e.stopPropagation();$('theme-panel').classList.toggle('hidden')}
function toggleEngineMenu(e){e.stopPropagation();$('engine-menu').classList.toggle('hidden')}
function selectEngine(key){const e=engines[key],f=$('search-form'),i=$('search-input');f.action=e.action;i.name=e.name;i.placeholder=e.placeholder;$('engine-icon').className=e.icon;$('engine-menu').classList.add('hidden');localStorage.setItem('nav_engine',key)}
function applyWallpaperStyles(url){document.body.style.backgroundImage=`url("${url.replace(/"/g,'\\"')}")`;document.body.style.backgroundPosition='center';document.body.style.backgroundSize='cover';document.body.style.backgroundRepeat='no-repeat';document.body.style.backgroundAttachment='fixed';document.body.classList.add('has-custom-bg')}
function applyCustomBg(){if(!isAdmin)return;const url=$('custom-bg-input').value.trim();if(!/^https?:\/\//i.test(url))return alert('请输入有效的图片网址');applyWallpaperStyles(url);cloudConfig.wallpaper=url;saveConfig()}
function clearCustomBg(){if(!isAdmin)return;document.body.style.backgroundImage='';document.body.classList.remove('has-custom-bg');cloudConfig.wallpaper='';$('custom-bg-input').value='';saveConfig()}
async function saveConfig(){if(!isAdmin)return;const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cloudConfig)});if(!r.ok)alert('保存失败，请检查后台登录状态')}
async function updateAdminPwd(){if(!isAdmin)return;const p=$('custom-pwd-input').value.trim();if(!p)return;cloudConfig.adminPwd=p;$('custom-pwd-input').value='';await saveConfig();alert(t('pwdok'))}

async function triggerAdminLogin(){
 if(isAdmin)return alert('您已经登录后台。');
 const p=prompt(t('login'));if(p===null)return;
 const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
 if(!r.ok)return alert(t('fail'));
 isAdmin=true;await loadCloudData();checkAdminSession();alert(t('success'));
}
async function logoutAdmin(){await fetch('/api/auth',{method:'DELETE'});isAdmin=false;cloudConfig={wallpaper:"",dynamicSections:[]};expandedDynamicSections={};checkAdminSession();await loadCloudData();$('theme-panel').classList.add('hidden');alert(t('logout'))}
function checkAdminSession(){document.body.classList.toggle('is-admin',isAdmin);$('admin-badge').classList.toggle('hidden',!isAdmin)}
async function initAuth(){const r=await fetch('/api/auth');if(r.ok){const d=await r.json();isAdmin=!!d.authenticated}checkAdminSession()}

async function loadCloudData(){
 try{
  const r=await fetch('/api/config');if(r.ok){const d=await r.json();cloudConfig={wallpaper:d.wallpaper||'',dynamicSections:Array.isArray(d.dynamicSections)?d.dynamicSections:[],...(isAdmin&&d.adminPwd?{adminPwd:d.adminPwd}:{})}}
 }catch{}
 if(cloudConfig.wallpaper){applyWallpaperStyles(cloudConfig.wallpaper);$('custom-bg-input').value=cloudConfig.wallpaper}
 else {document.body.style.backgroundImage='';document.body.classList.remove('has-custom-bg')}
 renderDynamicSections();
 await loadCustomLinks();
}
async function loadCustomLinks(){
 let links=[];
 try{const r=await fetch('/api/links');if(r.ok)links=await r.json()}catch{}
 const c=$('custom-links-container'),w=$('expand-action-wrapper');c.innerHTML='';
 if(!links.length){c.innerHTML=`<div class="col-span-full text-center text-xs text-slate-400/60 py-8">${t('noLinks')}</div>`;w.classList.add('hidden');return}
 const visible=isCustomLinksExpanded?links:links.slice(0,9),compact=links.length>6;
 c.className=compact?'grid grid-cols-3 gap-2':'grid grid-cols-2 gap-3';
 visible.forEach((x,i)=>c.appendChild(makeLinkElement(x,i,'custom')));
 if(links.length>9){w.classList.remove('hidden');$('expand-btn').innerHTML=isCustomLinksExpanded?t('collapse'):`${t('expand')} (${links.length-9})`;}else w.classList.add('hidden');
}
function makeLinkElement(x,i,type,secId=null){
 const d=document.createElement('div');d.className='group relative flex items-center p-3 bg-slate-500/5 border border-slate-500/10 rounded-xl hover:bg-indigo-600/10 transition-all';
 const a=document.createElement('a');a.href=x.url;a.target='_blank';a.rel='noopener noreferrer';a.className='flex items-center gap-2.5 truncate w-full pr-5 text-sm font-medium';a.innerHTML=`<span class="w-5 h-5 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-[10px]">${escapeHtml((x.name||'?')[0].toUpperCase())}</span><span class="truncate">${escapeHtml(x.name)}</span>`;
 d.appendChild(a);
 if(isAdmin){
  const b=document.createElement('button');b.className='absolute right-2 text-xs text-slate-400 hover:text-red-400 opacity-0 group-hover:opacity-100';b.innerHTML='<i class="fas fa-trash"></i>';b.onclick=e=>{e.preventDefault();e.stopPropagation();deleteLink(type,i,secId)};d.appendChild(b);
  const tag=document.createElement('span');tag.className='absolute left-1 top-1 text-[8px] px-1 rounded bg-indigo-500/20 text-indigo-300';tag.textContent=x.private?t('private'):t('public');d.appendChild(tag);
 }
 return d;
}
async function deleteLink(type,i,secId){
 if(!confirm(t('deleteLink')))return;
 if(type==='custom'){let r=await fetch('/api/links');let a=r.ok?await r.json():[];a.splice(i,1);await fetch('/api/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a)});await loadCustomLinks()}
 else {const s=cloudConfig.dynamicSections.find(x=>x.id===secId);if(s){s.links.splice(i,1);await saveDynamicSections();}}
}
function toggleExpandCustomLinks(){isCustomLinksExpanded=!isCustomLinksExpanded;loadCustomLinks()}

function renderDynamicSections(){
 document.querySelectorAll('.dynamic-section-card').forEach(x=>x.remove());
 const grid=$('main-nav-grid'),add=$('add-section-card');
 (cloudConfig.dynamicSections||[]).forEach(sec=>{
  const card=document.createElement('section');card.className='dynamic-section-card glass-card rounded-2xl p-6 shadow-xl relative';card.draggable=isAdmin;
  const head=document.createElement('div');head.className='flex justify-between items-center mb-4';
  const title=document.createElement('h3');title.className='text-lg font-semibold text-indigo-400';title.innerHTML=`<i class="fas fa-layer-group mr-2.5"></i>${escapeHtml(sec.title)}`;
  if(isAdmin){const controls=document.createElement('div');controls.className='flex gap-1.5';controls.innerHTML=`<button class="text-[10px] px-2 py-1 bg-indigo-600/20 text-indigo-400 rounded">添加</button><button class="text-[10px] px-2 py-1 bg-sky-600/20 text-sky-400 rounded">重命名</button><button class="text-[10px] px-2 py-1 bg-red-600/20 text-red-400 rounded">删除</button>`;controls.children[0].onclick=()=>openLinkModal('section_'+sec.id);controls.children[1].onclick=()=>renameCustomSection(sec.id);controls.children[2].onclick=()=>deleteCustomSection(sec.id);head.append(title,controls)}else head.appendChild(title);
  card.appendChild(head);
  const body=document.createElement('div');const links=sec.links||[];const shown=expandedDynamicSections[sec.id]?links:links.slice(0,9);body.className=links.length>6?'grid grid-cols-3 gap-2':'grid grid-cols-2 gap-3';
  shown.forEach((x,i)=>body.appendChild(makeLinkElement(x,i,'section',sec.id)));card.appendChild(body);
  if(links.length>9){const more=document.createElement('button');more.className='w-full mt-4 pt-2 border-t border-slate-500/10 text-xs text-indigo-400';more.textContent=expandedDynamicSections[sec.id]?t('collapse'):`${t('expand')} (${links.length-9})`;more.onclick=()=>{expandedDynamicSections[sec.id]=!expandedDynamicSections[sec.id];renderDynamicSections()};card.appendChild(more)}
  grid.insertBefore(card,add);
 });
 checkAdminSession();
}
async function saveDynamicSections(){await saveConfig();renderDynamicSections()}
function addCustomSection(){if(!isAdmin)return;const title=prompt(t('promptSection'));if(!title?.trim())return;cloudConfig.dynamicSections.push({id:Date.now().toString(),title:title.trim(),private:false,links:[]});saveDynamicSections()}
function renameCustomSection(id){const s=cloudConfig.dynamicSections.find(x=>x.id===id);if(!s)return;const n=prompt(t('rename'),s.title);if(n?.trim()){s.title=n.trim();saveDynamicSections()}}
function deleteCustomSection(id){if(!confirm(t('deleteSection')))return;cloudConfig.dynamicSections=cloudConfig.dynamicSections.filter(x=>x.id!==id);saveDynamicSections()}

async function openLinkModal(target){if(!isAdmin)return;currentModalTarget=target;$('site-name').value='';$('site-url').value='';$('private-link').checked=false;$('modal').classList.remove('hidden');$('modal').classList.add('flex');}
function toggleModal(show){$('modal').classList.toggle('hidden',!show);$('modal').classList.toggle('flex',show)}
function closeModalOnBlank(e){if(e.target.id==='modal')toggleModal(false)}
async function saveActiveLink(){
 const name=$('site-name').value.trim();let url=$('site-url').value.trim();if(!name||!url)return alert('请完整填写名称和网址');if(!/^https?:\/\//i.test(url))url='https://'+url;
 const item={name,url,private:$('private-link').checked};
 if(currentModalTarget==='custom'){const r=await fetch('/api/links');const a=r.ok?await r.json():[];a.push(item);await fetch('/api/links',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a)});await loadCustomLinks()}
 else if(currentModalTarget.startsWith('section_')){const id=currentModalTarget.slice(8),s=cloudConfig.dynamicSections.find(x=>x.id===id);if(s){s.links.push(item);await saveDynamicSections()}}
 else if(currentModalTarget==='friend'){let a=JSON.parse(localStorage.getItem('nav_friend_links')||'[]');a.push(item);localStorage.setItem('nav_friend_links',JSON.stringify(a));loadFriendLinks()}
 toggleModal(false)
}
function loadFriendLinks(){const c=$('friend-links-container');c.innerHTML='';JSON.parse(localStorage.getItem('nav_friend_links')||'[]').forEach((x,i)=>{const d=document.createElement('div');d.className='group relative p-2.5 bg-slate-500/5 border border-slate-500/10 rounded-xl text-center';d.innerHTML=`<a href="${safeUrl(x.url)}" target="_blank" rel="noopener noreferrer" class="text-xs font-medium text-slate-400 hover:text-emerald-400 truncate block">${escapeHtml(x.name)}</a>`;if(isAdmin){const b=document.createElement('button');b.className='absolute right-1 top-1 text-[10px] text-slate-500 hover:text-red-400';b.innerHTML='×';b.onclick=()=>{let a=JSON.parse(localStorage.getItem('nav_friend_links')||'[]');a.splice(i,1);localStorage.setItem('nav_friend_links',JSON.stringify(a));loadFriendLinks()};d.appendChild(b)}c.appendChild(d)})}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeUrl(s){try{const u=new URL(s);return /^https?:$/.test(u.protocol)?u.href:'#'}catch{return '#'}}

function updateClock(){const n=new Date(),h=n.getHours();$('clock').textContent=[h,n.getMinutes(),n.getSeconds()].map((x,i)=>String(x).padStart(2,'0')).join(':');let g=currentLang==='zh'?(h<5?'🌙 夜深了，早点休息哦':h<8?'🌅 早上好，新的一天充满希望':h<11.5?'☀️ 早上好，专注当下':h<13.5?'🍲 中午好，记得按时吃饭':h<17.5?'☕ 下午好，继续保持高效':h<19.5?'🌇 傍晚好，享受夜晚吧':'✨ 晚上好，享受属于自己的时光'):(h<5?'🌙 Good night.':h<12?'☀️ Good morning.':h<18?'☕ Good afternoon.':'✨ Good evening.');$('greeting').textContent=g}
async function fetchWeather(){try{const a=await fetch('https://ipapi.co/json/');const p=await a.json();const w=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current_weather=true`);const d=await w.json();$('weather-info').textContent=`${p.city||'Earth'} · ${Math.round(d.current_weather.temperature)}°C`}catch{$('weather-info').textContent='☁️ Weather unavailable'}}
function renderAll(){document.documentElement.lang=currentLang==='zh'?'zh-CN':'en';selectEngine(localStorage.getItem('nav_engine')||'google');loadFriendLinks();renderDynamicSections();loadCustomLinks()}
document.addEventListener('click',()=>{$('engine-menu').classList.add('hidden');$('theme-panel').classList.add('hidden')});
(async()=>{document.body.classList.add(localStorage.getItem('nav_theme_mode')||'theme-dark');updateClock();setInterval(updateClock,1000);await initAuth();await loadCloudData();loadFriendLinks();fetchWeather();checkAdminSession()})();
</script>
</body>
