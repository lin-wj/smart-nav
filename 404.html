<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面未找到 - Smart Nav</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
body{min-height:100vh;background:linear-gradient(135deg,#0f172a,#020617);color:#f8fafc}
body.theme-light{background:linear-gradient(135deg,#f8fafc,#e2e8f0);color:#0f172a}
.glass{background:rgba(30,41,59,.48);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.07);box-shadow:0 18px 35px -15px rgba(0,0,0,.35)}
.theme-light .glass{background:rgba(255,255,255,.72);border-color:rgba(0,0,0,.06);box-shadow:0 12px 30px -12px rgba(0,0,0,.12)}
</style>
</head>
<body class="theme-dark font-sans antialiased flex items-center justify-center">
<div class="text-center px-4">
  <div class="glass rounded-2xl p-12 max-w-md">
    <div class="text-8xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 mb-4">
      404
    </div>
    <p class="text-slate-400 text-lg mb-2">页面未找到</p>
    <p class="text-slate-500 text-sm mb-8">您访问的页面不存在或已被移除</p>
    <a href="/" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm transition-colors">
      <i class="fas fa-home"></i>返回主页
    </a>
  </div>
</div>
</body>
</html>
